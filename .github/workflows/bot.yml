name: Executar Bot Blogger RSS

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora automaticamente
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar Dependências
      run: npm install rss-parser

    - name: Executar Bot
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      run: node index.js

    - name: Salvar o estado do último link postado
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add last_link.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "Atualiza último link postado [skip ci]"
        git push
